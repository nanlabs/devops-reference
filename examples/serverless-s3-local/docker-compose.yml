---
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    privileged: true
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  localstack:
    image: localstack/localstack:2026.08.3
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: >-
        ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env.local}
      SERVICES: s3,lambda,iam,logs,cloudformation,sts
      AWS_DEFAULT_REGION: us-east-1
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on:
      - docker-proxy
    networks:
      - default
      - docker-api

networks:
  docker-api:
    internal: true
