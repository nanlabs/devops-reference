service: ${env:SERVICE_NAME}

frameworkVersion: "4"

plugins:
  - serverless-offline

useDotenv: true

package:
  individually: true
  excludeDevDependencies: true

custom:
  serverless-offline:
    httpPort: 3000
    port: 3000
    noPrependStageInUrl: true

provider:
  name: aws
  stage: local
  runtime: nodejs22.x
  deploymentBucket:
    blockPublicAccess: true
    versioning: true
    serverSideEncryption: AES256

functions:
  officialMiddlewareExample:
    handler: src/handlers/post.officialMiddlewareHandler
    events:
      - http:
          path: /
          method: POST
  customMiddlewareExample:
    handler: src/handlers/get.customMiddlewareHandler
    events:
      - http:
          path: /
          method: GET
